<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<title>KoshKit - Personal Finance Tools</title>
		<meta
			name="description"
			content="Compare FD vs tax-deferred fund growth at the same nominal rate. See how annual TDS interrupts compounding, with compounding leakage, post-tax XIRR, and year-by-year audit."

			name="theme-color"
			content="#1B4332"

			media="(prefers-color-scheme: dark)"

			rel="icon"
			type="image/png"
			href="/favicon-light.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			href="/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta property="og:title" content="KoshKit - Personal Finance Tools" />
		<meta
			property="og:description"
			content="Same rate, different tax timing: FD tax paid yearly vs mutual fund tax deferred to withdrawal. Visualize the divergence and the rupee leakage."
